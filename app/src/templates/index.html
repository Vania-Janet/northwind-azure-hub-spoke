{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Agente IA — Departamento de {{ user.department | title }}</h5>
            <div class="d-flex gap-2">
                <button id="files-btn" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#filesModal">
                    Ver archivos
                </button>
                <button id="clear-btn" class="btn btn-sm btn-outline-secondary">Nueva conversación</button>
            </div>
        </div>

        <div id="chat-box" class="border rounded p-3 mb-3 bg-light" style="height: 420px; overflow-y: auto;">
            <p class="text-muted text-center small">Haz una pregunta sobre tu departamento.</p>
        </div>

        <form id="chat-form">
            <div class="input-group">
                <input type="text" id="user-input" class="form-control"
                       placeholder="Escribe tu pregunta..." required>
                <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal de archivos del departamento -->
<div class="modal fade" id="filesModal" tabindex="-1" aria-labelledby="filesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="filesModalLabel">Archivos — {{ user.department | title }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="files-body">
                <p class="text-muted text-center">Cargando...</p>
            </div>
            <div class="modal-footer" id="files-footer" style="display:none">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="back-btn">← Volver</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
            <div class="modal-footer" id="files-footer-default">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');

const filesBody = document.getElementById('files-body');
const filesFooter = document.getElementById('files-footer');
const filesFooterDefault = document.getElementById('files-footer-default');

function showFileList(files, container) {
    filesFooter.style.display = 'none';
    filesFooterDefault.style.display = '';
    if (!files || files.length === 0) {
        filesBody.innerHTML = '<p class="text-muted text-center">No hay archivos en este contenedor.</p>';
        return;
    }
    const rows = files.map(f =>
        `<tr style="cursor:pointer" onclick="openFile('${f.name}')">
            <td><span class="text-primary">${f.name}</span></td>
            <td class="text-end text-muted small">${f.size}</td>
        </tr>`
    ).join('');
    filesBody.innerHTML = `<p class="text-muted small mb-2">Contenedor: <code>${container}</code> — haz clic en un archivo para verlo</p>
        <table class="table table-sm table-hover mb-0">
            <thead><tr><th>Archivo</th><th class="text-end">Tamaño</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
}

async function openFile(filename) {
    filesBody.innerHTML = '<p class="text-muted text-center">Cargando contenido...</p>';
    filesFooter.style.display = '';
    filesFooterDefault.style.display = 'none';
    try {
        const res = await fetch(`/api/files/${encodeURIComponent(filename)}`);
        const data = await res.json();
        if (data.error) {
            filesBody.innerHTML = `<p class="text-danger">${data.error}</p>`;
            return;
        }
        if (data.type === 'text') {
            const escaped = data.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            filesBody.innerHTML = `<h6 class="mb-2">${filename}</h6>
                <pre class="bg-light p-3 rounded small" style="max-height:400px;overflow-y:auto;white-space:pre-wrap">${escaped}</pre>`;
        } else {
            filesBody.innerHTML = `<p class="text-muted text-center">${data.message || 'Vista previa no disponible.'}</p>`;
        }
    } catch {
        filesBody.innerHTML = '<p class="text-danger text-center">Error al cargar el archivo.</p>';
    }
}

document.getElementById('back-btn').addEventListener('click', () => loadFileList());

async function loadFileList() {
    filesBody.innerHTML = '<p class="text-muted text-center">Cargando...</p>';
    filesFooter.style.display = 'none';
    filesFooterDefault.style.display = '';
    try {
        const res = await fetch('/api/files');
        const data = await res.json();
        if (data.error) {
            filesBody.innerHTML = `<p class="text-warning text-center">${data.error}</p>`;
            return;
        }
        showFileList(data.files, data.container);
    } catch {
        filesBody.innerHTML = '<p class="text-danger text-center">Error al conectar con el almacenamiento.</p>';
    }
}

document.getElementById('filesModal').addEventListener('show.bs.modal', loadFileList);

async function loadHistory() {
    const res = await fetch('/api/chat/history');
    const data = await res.json();
    if (data.history && data.history.length > 0) {
        chatBox.innerHTML = '';
        data.history.forEach(msg => {
            const sender = msg.role === 'user' ? 'Tú' : 'Agente';
            appendMessage(sender, msg.content, msg.role === 'user' ? 'user' : 'agent');
        });
    }
}
loadHistory();

document.getElementById('clear-btn').addEventListener('click', async () => {
    await fetch('/api/chat/clear', { method: 'POST' });
    chatBox.innerHTML = '<p class="text-muted text-center small">Haz una pregunta sobre tu departamento.</p>';
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    appendMessage('Tú', question, 'user');
    input.value = '';
    input.disabled = true;

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: question})
        });
        const data = await res.json();
        appendMessage('Agente', data.reply || data.error, 'agent');
    } catch {
        appendMessage('Error', 'No se pudo conectar con el servidor.', 'agent');
    } finally {
        input.disabled = false;
        input.focus();
    }
});

function appendMessage(sender, text, type) {
    const div = document.createElement('div');
    div.className = 'mb-2 ' + (type === 'user' ? 'text-end' : '');
    div.innerHTML = '<strong>' + sender + ':</strong> ' + text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
{% endblock %}
